[project]
name = "circuit-graph"
version = "0.1.0"
description = "Python circuit understanding platform with CircuitOps LPG export"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "click>=8.0",
    "jlc2kicadlib>=1.2.3",
    "python-dotenv>=1.2.2",
    "numpy>=1.24",
    "sexpdata>=1.0",  # circuit_graph.erc.extractor requires it at module load
    "tomli_w>=1.0",  # circuit_graph.bootstrap writes .cg.toml via tomli_w
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    # layout 模块的可选运行时依赖；6 个 layout 测试需要它（3 个文件已用
    # pytest.importorskip 优雅降级）。不声明它时 uv sync 会把它从 .venv 修剪掉，
    # 导致无保护导入的测试直接失败（2026-08-17 实测）。
    "kicad-sch-api>=0.2.0",
]

[project.scripts]
cg = "circuit_graph.cli:main"
pin2json = "circuit_graph.knowledge.chip_resolver:_parse_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]

[tool.hatch.build.targets.wheel]
packages = ["circuit_graph"]

[tool.hatch.build.targets.wheel.force-include]
"circuit_graph/skills" = "circuit_graph/skills"
