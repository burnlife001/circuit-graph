name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      # Repo-wide ruff has ~950 pre-existing style findings; gate only on
      # undefined names (the bug class that bites at runtime).
      - name: Ruff (undefined names)
        run: uv run ruff check --select F821,F823 circuit_graph

      - name: Pytest
        run: uv run pytest -q
